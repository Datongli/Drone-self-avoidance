defaults:
  - _self_
  - env
  - uav


mode: "test"  # test模式
# renderMode: "human"  # 渲染模式
renderMode: null  # 渲染模式
device: "cuda:0"  # 训练设备

# 测试参数
modelSavePath: "checkPoint/save_checkPoint"  # 模型保存路径
actionBound: 2.0  # 动作限制
# 模型种类
navigationModel: "SAC"  
# navigationModel: "DDPG"
# navigationModel: "SACWithQ2"
# navigationModel: "SACWithoutGate"
# navigationModel: "SACWithoutTransformerAndGate"
# navigationModel: "PointTransSAC"
# navigationModel: "SetTransSAC"
# navigationModel: "DPRL"
# 加载的模型名称
SACloadModel: "SAC_only_mean_good.pt"  
# SACloadModel: "without_gate.pt"
# SACloadModel: "without_transformer_and_gate.pt"  
# SACloadModel: "PointTransSAC.pt"  
# SACloadModel: "SetTransSAC.pt"  
# SACloadModel: "DPRL.pt"  

DDPGPthDir: "../checkPoint"  # DDPG模型权重目录
testEpisodes: 100  # 测试轮次
testUavNums: 10  # 测试的无人机数量
envLevel: 50  # 环境难度等级
seed: null  # 环境初始化的随机数种子
# 可选，配置测试时目标和无人机起始位置，不配置则为随机生成
# targetPosition: [45, 170, 5]  # 目标点位置
# uavInitPosition: [74.2305, 8.2587, 7.7947]  # 无人机初始位置列表，每个元素为[X, Y, Z]

# wandb配置
wandb:
  enabled: False  # 是否启用wandb
  project: XTDrone-DRL  # wandb项目名
  name: navigation-training-gym  # wandb实验名
  entity: ldt20020517-beihang-university  # wandb实体名
  mode: online   # wandb模式
  id: kw9xf9k7  # wandb实验ID
  dir: wandb  # wandb保存目录
  resumeFlag: False  # 是否恢复实验
  checkPointDir: checkPoint  # 模型保存目录
  checkPointPath: checkPoint/kw9xf9k7.pt  # 模型保存路径
  saveEvery: 100  # 每训练n轮保存一次模型